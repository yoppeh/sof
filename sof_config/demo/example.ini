; The settings of a small web service, for trying the ini program on.
name = example service
debug = off

[server]
host = 0.0.0.0
port = 8080
timeout = 2.5
banner = "Welcome!\n\tMind the gap."

[database]
url = postgres://db.example.com:5432/app   ; a raw value ends at a comment
pool = 0x10
readonly = yes

; A section can be declared again, and a key assigned again replaces its
; value, as a file given later on the command line would.
[server]
port = 8443
