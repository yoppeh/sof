; A small branch on a busy day: three tellers, eight hours, a customer
; about every minute, each taking about two and a half minutes to serve.
; Read by the bank program: ./bank bank.ini

[bank]
tellers = 3
open = 480          ; minutes the doors are open
seed = 1            ; the same seed gives the same day

[arrivals]
mean = 1.0          ; minutes between customers, on average
draw = exponential  ; or fixed: exactly mean minutes apart

[service]
mean = 2.5          ; minutes per customer, on average
draw = exponential
