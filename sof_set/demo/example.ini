; The libraries of this collection that the deps program is built from, and
; what each one uses. Each line is "target = what it depends on".

[program]
deps = sof_config sof_copt sof_hashmap sof_log sof_queue sof_set

[libraries]
sof_config = sof_alloc sof_hash sof_hashmap sof_utf
sof_hashmap = sof_alloc sof_hash
sof_log = sof_alloc
sof_queue = sof_alloc
sof_set = sof_alloc sof_hashmap
sof_copt =
sof_hash =
sof_utf =
sof_alloc =
