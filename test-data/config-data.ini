; config-data.ini
;
; Test input for the config library. config/test.c checks every assignment
; in it, in order, so change the two together.
# Comments can start with ; or #.


; The first two assignments don't belong to a section.
key1 = somevalue
key2 = "a quoted value"

; section 1 has raw values: everything to the end of the line, trimmed.
[section 1]     ; a comment can follow a section declaration

key1 = value1   ; comments are fine here
key2 = a value with spaces   # and here
key3 = 1234
key4 = 3.141
key5 = Raw values run to the end of the line, and are trimmed: they can hold "quotes" and = signs.
key6 = semi;colon and hash#tag stay, because no space comes before them
key7 =
key8 = ; an empty value, then a comment
key9 = a = b = c


; section 2 has quoted values, which keep their spaces and replace escapes.
[section 2]
key1 = "this is a quoted value"  ; comments are fine here too
key2 = "-3.141592"
key3 = "this is testing \t escape characters\n"
key4 = "every escape: \a\b\f\n\r\t\v \\ \" \' and in hex: \x41\x7e"
key5 = "code points: \u00e9 \u65e5\u672c \U0001F600"
key6 = ""
key7 = "   leading and trailing spaces   "
key8 = "a	tab, kept as it is"
key9 = "can you have [special characters] ; # = in a quoted value? ;;;" ; let's see!
key10 = "#fff"   ; a value that starts with ; or # must be quoted


; Keys and section names can have letters, digits, _, - and .
[section_3-with.punctuation]
	tabbed	=	tabs		; tabs are whitespace too
under_score = 1
dash-ed = 2
dotted.key = 3
-leading-dash = 4
_leading_underscore = 5
123numeric = 6
CamelCase = 7
a_key_well_over_thirty_two_characters_long_so_its_buffer_grows = grown


; Values to read with the typed getters.
[types]
port = 8080
negative = -42
mask = 0xff
ratio = 0.75
big = 1e300
enabled = yes
disabled = Off
not_a_number = 12abc


; Raw values can hold anything but newlines and NUL, and have no escapes.
[section 5]
punctuation = !#$%&'()*+,-./:<=>?@[\]^_`{|}~
quotes_inside = a"b"c
backslashes = C:\path\to\file
utf8 = café-ñ-日本
quoted_utf8 = "naïve – “quotes”"
url = http://example.com/a?b=c&d=e#f


; A section name is trimmed.
[   padded name   ]
inside = yes

; A section can be declared again. A key assigned twice keeps the last value
; and the place of the first.
[section 1]
key1 = replaced
key10 = back_in_section_1

[server.http]
host = example.com


; The last section has a long value, and ends the file without a newline.
[last]
long = 
no_newline = "at the end of the file"